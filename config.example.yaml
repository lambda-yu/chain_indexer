database:
  url: "sqlite+aiosqlite:///./chain_indexer.db"
  echo: false

redis:
  url: "redis://localhost:6379/0"

worker:
  default_confirmation_blocks: 12
  default_poll_interval_ms: 3000
  notify_concurrency: 50
  config_reload_interval_s: 5
  shutdown_grace_s: 30

web:
  host: "0.0.0.0"
  port: 8000

logging:
  level: "INFO"
  format: "json"
