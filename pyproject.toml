[project]
name = "chain-indexer"
version = "0.1.0"
description = "Multi-chain block indexer with pluggable notification channels"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",          # default driver; users may add asyncpg/asyncmy
    "redis>=5.0",
    "httpx[http2]>=0.27",
    "web3>=6.15",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "solders>=0.21,<0.30",
    "base58>=2.1,<3",
    "borsh-construct>=0.1.0,<0.2",
    "jsonschema>=4.20,<5",
    "prometheus-client>=0.20.0",
]

[project.scripts]
chain-indexer-worker = "apps.worker.main:main"
chain-indexer-web    = "apps.web.main:main"  # populated in Chunk 9

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "psycopg2-binary>=2.9"]
mysql = ["asyncmy>=0.2.9"]
kafka = ["confluent-kafka>=2.3"]
rabbitmq = ["aio-pika>=9.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "testcontainers>=4.0",
    "respx>=0.20",                # httpx mocking
    "types-PyYAML>=6.0",
    "eth-account>=0.11,<1",
    "types-jsonschema>=4.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["E501"]   # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires testcontainers",
    "e2e: end-to-end tests; require Foundry/Anvil and run a webhook receiver in-process",
]
addopts = "-q --strict-markers"
